<html>
    <head>
        <title>Learn Form</title>
    </head>
    <body>
        <form
            action="https://tranduythanh.com/process.html"
            method="get"
        
        >
            <h1>Login System</h1>
            <table>
                <tr>
                    <td
                    <label for="username">User name:</label>

                    </td>
                    <td><input type="text" name="username" id="username"></td>
                </tr>
                <tr>
                    <td>
                        <label for="password">Password</label> 
                        
                    </td>
                    <td><input type="password" name="password" id="password"></td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td>
                        <input type="checkbox" name="saveinfor" id="saveinfor">
                        <label for="saveinfor">Save login Information</label> 
                    </td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td>
                        <input type="submit" value="Login">
                        |
                        <input type="reset" value="reset">
                        |
                        <button type="reset">Reset 2</button>
                        <button type="button" onclick="this.style.color='red'">Click Me</button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
